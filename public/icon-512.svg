<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <g filter="url(#glow)">
    <!-- Circuit / Gear accent ring -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="#60A5FA" stroke-width="8" stroke-dasharray="24 16" opacity="0.4" />
    <!-- Dynamic Lightning Bolt Symbol -->
    <path d="M280 80 L160 270 L248 270 L216 432 L360 232 L272 232 Z" fill="url(#bolt)" stroke="#CA8A04" stroke-width="4" stroke-linejoin="round" />
    <!-- Industrial Dot Accents -->
    <circle cx="160" cy="140" r="12" fill="#93C5FD" />
    <circle cx="352" cy="372" r="12" fill="#93C5FD" />
  </g>
</svg>
